    <script type="module">
      import RefreshRuntime from '/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script>
      // Gracefully handle Vite dev-server HMR connection fluctuations in iframe environments
      window.addEventListener('error', function (e) {
        if (e && (e.message?.includes('WebSocket') || e.error?.message?.includes('WebSocket'))) {
          e.stopImmediatePropagation();
        }
      });
      const _origError = console.error;
      console.error = function (...args) {
        if (args.some(function (a) {
          return (typeof a === 'string' && a.includes('WebSocket closed without opened')) ||
                 (a && a.message && typeof a.message === 'string' && a.message.includes('WebSocket closed without opened'));
        })) {
          return;
        }
        _origError.apply(console, args);
      };
    </script>
