<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1B2A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0C1B2A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <circle cx="256" cy="230" r="190" fill="url(#haloGrad)"/>

  <!-- Ornate Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="70" fill="none" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Sacred Hebrew & Greek Inscriptions -->
  <text x="256" y="95" text-anchor="middle" font-family="'Frank Ruhl Libre', serif" font-size="28" fill="#F3E5AB" letter-spacing="4">בְּרֵאשִׁית • ΕΝ ΑΡΧΗ</text>

  <!-- Open Bible Stylized Leaves -->
  <g transform="translate(256, 260)">
    <!-- Book Spine Glow -->
    <path d="M0,70 L0,-40" stroke="#C9A227" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Left Page -->
    <path d="M-5,-40 C-60,-55 -130,-45 -165,-20 C-168,40 -165,80 -165,100 C-130,75 -60,65 -5,75 Z" 
          fill="#FBF9F5" stroke="#C9A227" stroke-width="3.5"/>
    <!-- Left Page Lines -->
    <line x1="-140" y1="0" x2="-25" y2="-10" stroke="#DFD6BD" stroke-width="3" stroke-linecap="round"/>
    <line x1="-140" y1="25" x2="-25" y2="15" stroke="#DFD6BD" stroke-width="3" stroke-linecap="round"/>
    <line x1="-140" y1="50" x2="-25" y2="40" stroke="#DFD6BD" stroke-width="3" stroke-linecap="round"/>
    <line x1="-140" y1="75" x2="-45" y2="65" stroke="#C9A227" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Page -->
    <path d="M5,-40 C60,-55 130,-45 165,-20 C168,40 165,80 165,100 C130,75 60,65 5,75 Z" 
          fill="#FBF9F5" stroke="#C9A227" stroke-width="3.5"/>
    <!-- Right Page Lines -->
    <line x1="25" y1="-10" x2="140" y2="0" stroke="#DFD6BD" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="15" x2="140" y2="25" stroke="#DFD6BD" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="40" x2="140" y2="50" stroke="#DFD6BD" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="65" x2="140" y2="75" stroke="#C9A227" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Cross Embellishment Rising from Center -->
    <g transform="translate(0, -65)">
      <circle cx="0" cy="-10" r="28" fill="#0C1B2A" stroke="url(#goldGrad)" stroke-width="3"/>
      <!-- Cross Horizontal -->
      <path d="M-15,-10 L15,-10" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
      <!-- Cross Vertical -->
      <path d="M0,-24 L0,12" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
      <!-- Radiating Golden Rays -->
      <line x1="0" y1="-32" x2="0" y2="-42" stroke="#F3E5AB" stroke-width="2" stroke-linecap="round"/>
      <line x1="-22" y1="-32" x2="-29" y2="-39" stroke="#F3E5AB" stroke-width="2" stroke-linecap="round"/>
      <line x1="22" y1="-32" x2="29" y2="-39" stroke="#F3E5AB" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title Bottom Typography -->
  <text x="256" y="420" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="28" fill="url(#goldGrad)" letter-spacing="3">BÍBLIA INTERLINEAR</text>
  <text x="256" y="452" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#F3E5AB" letter-spacing="5">APOLINÁRIO</text>
</svg>